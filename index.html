        // Управление видимостью кнопок навигации
        function updateScrollButtons() {
            const scrollButtons = document.querySelector('.scroll-buttons');
            const upBtn = document.querySelector('.scroll-btn[onclick="scrollToTop()"]');
            const downBtn = document.querySelector('.scroll-btn[onclick="scrollToBottom()"]');
            
            const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
            const scrollHeight = document.documentElement.scrollHeight;
            const clientHeight = window.innerHeight;
            
            const showUp = scrollTop > 300;
            const showDown = scrollTop < (scrollHeight - clientHeight - 300);
            
            if (showUp || showDown) {
                scrollButtons.classList.add('visible');
                upBtn.style.display = showUp ? 'flex' : 'none';
                downBtn.style.display = showDown ? 'flex' : 'none';
            } else {
                scrollButtons.classList.remove('visible');
            }
        }

        // Слушатель прокрутки
        window.addEventListener('scroll', updateScrollButtons);
        window.addEventListener('resize', updateScrollButtons);

        // Инициализация при загрузке страницы
        document.addEventListener('DOMContentLoaded', function() {
            // Устанавливаем активную вкладку "Списки чтения"
            currentTab = 'reading-lists';
            
            updateTabIndicator();
            
            // Если есть списки чтения, открываем первый
            if (readingLists.length > 0) {
                expandedLists.add(readingLists[0]);
            }
            
            renderReadingLists();
            initFormUi();
            MobileReadingLists.bind();

            const sortSelect = document.querySelector('#collection .sort-select');
            if (sortSelect) {
                sortSelect.value = currentSort;
                refreshCustomSelect(sortSelect);
            }
            
            const viewButtons = document.querySelector('#collection .view-toggle');
            if (viewButtons) {
                Array.from(viewButtons.children).forEach(btn => btn.classList.remove('active'));
                if (currentView === 'list') {
                    viewButtons.children[0].classList.add('active');
                } else {
                    viewButtons.children[1].classList.add('active');
                }
            }
            refreshIcons();
        });

        // Инициализация
        updateTabIndicator();
        
        // Устанавливаем активную вкладку "Списки чтения" по умолчанию
        if (readingLists.length > 0) {
            expandedLists.add(readingLists[0]);
        }
        renderReadingLists();

        // --- Функция для оборачивания выделенного текста ---
        function wrapSelection(textareaId, before, after) {
            const textarea = document.getElementById(textareaId);
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const value = textarea.value;
            if (start !== end) {
                const selected = value.substring(start, end);
                textarea.value = value.substring(0, start) + before + selected + after + value.substring(end);
                textarea.focus();
                textarea.selectionStart = start + before.length;
                textarea.selectionEnd = end + before.length;
            } else {
                // Если ничего не выделено, вставляем шаблон
                textarea.value = value.substring(0, start) + before + after + value.substring(end);
                textarea.focus();
                textarea.selectionStart = textarea.selectionEnd = start + before.length;
            }
        }
        // --- Горячие клавиши для жирного и полупрозрачного ---
        document.getElementById('comicContent').addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
                e.preventDefault();
                wrapSelection('comicContent', '**', '**');
            }
            if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 't') {
                e.preventDefault();
                wrapSelection('comicContent', '~~', '~~');
            }
        });
        // --- Парсер разметки для comicContent ---
        function parseComicContent(content) {
            if (!content) return '';
            // Экранируем < и >
            content = content.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            // Жирный: **текст**
            content = content.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
            // Полупрозрачный: ~~текст~~
            content = content.replace(/~~(.+?)~~/g, '<span style="opacity:0.5">$1</span>');
            // Автоматически выделять жирным всё, что начинается с # и до пробела или конца строки, если не внутри **...**
            content = content.replace(/(^|\s)(#\S+)/g, function(match, p1, p2) {
                // Не оборачивать, если уже внутри <b>...</b>
                if (p1.match(/<b>$/)) return match;
                return p1 + '<b>' + p2 + '</b>';
            });
            content = content.replace(/(https?:\/\/[\w\-._~:/?#[\]@!$&'()*+,;=%]+)/g, '<a class="content-link-btn" href="$1" target="_blank" rel="noopener noreferrer">тык</a>');
            return content;
        }



        function setReadingListsMode(mode) {
            readingListsMode = mode;
            localStorage.setItem('marvel-reading-lists-mode', mode);
            if (mode === 'double') {
                if (!openedLists || openedLists.length < 2) {
                    openedLists = readingLists.slice(0, 2);
                    localStorage.setItem('marvel-opened-lists', JSON.stringify(openedLists));
                }
            } else {
                if (!openedLists || openedLists.length === 0) {
                    openedLists = [readingLists[0]];
                    localStorage.setItem('marvel-opened-lists', JSON.stringify(openedLists));
                }
            }
            renderReadingLists();
        }
        function setOpenedList(listName, pos) {
            if (readingListsMode === 'double') {
                if (pos === 0) {
                    openedLists[0] = listName;
                } else {
                    openedLists[1] = listName;
                }
                // Не допускаем одинаковых списков
                if (openedLists[0] === openedLists[1]) {
                    openedLists[1] = readingLists.find(l => l !== openedLists[0]) || openedLists[0];
                }
            } else {
                openedLists = [listName];
            }
            localStorage.setItem('marvel-opened-lists', JSON.stringify(openedLists));
            renderReadingLists();
        }

        // Функция для переключения режима сортировки списка
        function setListSortMode(listName, mode) {
            listSortModes[listName] = mode;
            saveData();
            renderReadingLists();
        }

        // --- MOBILE: сворачивание сетки списков чтения ---
        const MobileReadingLists = {
            open: false,
            isMobile() {
                return window.matchMedia('(max-width: 768px)').matches;
            },
            bind() {
                const btn = document.getElementById('readingListsToggleBtn');
                if (!btn || btn.dataset.bound === '1') return;
                btn.dataset.bound = '1';
                btn.addEventListener('click', (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    if (!this.isMobile()) return;
                    this.open = !this.open;
                    this.apply();
                });
                window.addEventListener('resize', () => this.apply());
                this.apply();
            },
            apply() {
                const btn = document.getElementById('readingListsToggleBtn');
                const wrap = document.getElementById('readingListsGridWrap');
                const text = document.getElementById('readingListsToggleText');
                const iconWrap = document.getElementById('readingListsToggleIcon');
                if (!btn || !wrap) return;

                if (this.isMobile()) {
                    btn.style.display = 'flex';
                    wrap.classList.toggle('is-open', this.open);
                    btn.setAttribute('aria-expanded', this.open ? 'true' : 'false');
                    if (text) {
                        text.textContent = this.open ? 'Скрыть списки' : 'Показать списки';
                    }
                    if (iconWrap) {
                        iconWrap.innerHTML = icon(this.open ? 'chevron-up' : 'menu');
                    }
                } else {
                    btn.style.display = 'none';
                    wrap.classList.add('is-open');
                    this.open = false;
                    btn.setAttribute('aria-expanded', 'false');
                }
                refreshIcons();
            }
        };
        window.MobileReadingLists = MobileReadingLists;

        // --- MOBILE: ОТКЛЮЧЕНИЕ DOUBLE-РЕЖИМА ---
        function enforceSingleListModeOnMobile() {
            if (window.innerWidth <= 768) {
                readingListsMode = 'single';
                localStorage.setItem('marvel-reading-lists-mode', 'single');
                document.getElementById('modeSingleBtn').classList.add('active');
                document.getElementById('modeDoubleBtn').classList.remove('active');
                // Скрыть глобальный переключатель вида
                document.getElementById('globalReadingListToggle').style.display = 'none';
            }
        }
        window.addEventListener('resize', enforceSingleListModeOnMobile);
        document.addEventListener('DOMContentLoaded', enforceSingleListModeOnMobile);

        // --- МОДИФИКАЦИЯ renderReadingListContent для мобильных ---
        function renderSingleReadingListContent(listName, colIdx) {
            if (!listName) return '';
            const viewMode = listViewModes[listName] || 'list';
            const sortMode = listSortModes[listName] || 'years';
            const isMobile = window.innerWidth <= 768;
            return `
                <div class="reading-list-content active" style="">
                    <div class="reading-list-view-controls">
                        <h3 style="color: #eef2ff; margin: 0; flex: 1;">${listName}</h3>
                        ${!isMobile ? `
                            <button type="button" class="btn btn-secondary btn-slab" onclick="exportReadingListToTxt('${listName}')" title="Экспорт списка в TXT">${icon('file-text')}</button>
                            <button type="button" class="btn btn-secondary btn-slab" onclick="exportReadingListToJson('${listName}')" title="Экспорт списка в JSON">${icon('file-code')}</button>
                        ` : ''}
                        <div class="reading-list-sort-toggle">
                            <button class="${sortMode === 'years' ? 'active' : ''}" onclick="setListSortMode('${listName}', 'years')">По годам</button>
                            <button class="${sortMode === 'end' ? 'active' : ''}" onclick="setListSortMode('${listName}', 'end')">В конец</button>
                        </div>
                        <div class="reading-list-view-toggle view-toggle">
                            <button class="${viewMode === 'list' ? 'active' : ''}" onclick="toggleReadingListView('${listName}', 'list')" title="Список">${icon('list')}</button>
                            <button class="${viewMode === 'grid' ? 'active' : ''}" onclick="toggleReadingListView('${listName}', 'grid')" title="Сетка">${icon('layout-grid')}</button>
                        </div>
                    </div>
                    <div class="reading-list-body" data-list-name="${listName}">
                        ${renderReadingListBodyHtml(listName)}
                    </div>
                </div>
            `;
        }

        function createReadingListItem(comic, listName) {
            const isMobile = window.innerWidth <= 768;
            const isCurrent = listName && currentlyReading[listName] === comic.id;
            return `
                <div class="reading-list-item ${comic.isRead ? 'read' : ''}${isCurrent ? ' is-currently-reading' : ''}" data-comic-id="${comic.id}" data-list="${listName}">
                    <div class="reading-list-comic-info">
                        ${readingCoverMarkup(comic.cover, comic.title, 'reading-list-image')}
                        <div class="reading-list-text-info">
                            <div class="reading-list-main-info">
                                <div class="reading-list-title-text">${comic.title}</div>
                                <div class="reading-list-years">${comic.years}</div>
                            </div>
                            <div class="reading-list-content-text">${parseComicContent(comic.content)}</div>
                            <div class="reading-list-progress">
                                <div class="reading-list-progress-blocks${isMobile && comic._mobileProgressExpanded ? ' mobile-expanded' : ''}">
                                    ${createProgressBlocks(comic)}
                                </div>
                            </div>
                        </div>
                        <div class="drag-handle">${icon('grip-vertical')}</div>
                    </div>
                    <div class="comic-actions">${renderComicActions(comic, listName)}</div>
                </div>
            `;
        }

        // --- МОДИФИКАЦИЯ createProgressBlocks для мобильных ---
        function createProgressBlocks(comic) {
            const blocks = [];
            const totalIssues = Math.min(comic.totalIssues, 100);
            const isMobile = window.innerWidth <= 768;
            const expanded = comic._mobileProgressExpanded;
            const blockWidth = totalIssues <= 10 ? '40px' : 
                              totalIssues <= 20 ? '35px' : 
                              totalIssues <= 50 ? '30px' : '25px';
            if (isMobile && !expanded) {
                // Кнопка для раскрытия
                blocks.push(`
                    <button class="btn btn-secondary mobile-progress-toggle" style="margin:8px 0; font-size:15px; padding:10px 0; width:100%; display:block;" onclick="toggleMobileProgressBlocks(${comic.id})">Показать номера</button>
                `);
            }
            if (!isMobile || expanded) {
                for (let i = 1; i <= totalIssues; i++) {
                    let blockClass = 'progress-block';
                    if (i <= comic.readIssues) {
                        blockClass += ' read';
                    }
                    blocks.push(`
                        <div class="${blockClass}" 
                             data-comic-id="${comic.id}" 
                             data-issue="${i}"
                             onclick="updateComicProgressFromBlock(${comic.id}, ${i})"
                             title="Выпуск ${i}"
                             style="width: ${blockWidth};">
                            ${i}
                        </div>
                    `);
                }
                if (comic.totalIssues > 100) {
                    blocks.push(`
                        <div class="progress-block" style="background: #334155; cursor: default; width: ${blockWidth};" title="Всего выпусков: ${comic.totalIssues}">
                            +${comic.totalIssues - 100}
                        </div>
                    `);
                }
                if (isMobile) {
                    blocks.push(`
                        <button class="btn btn-secondary mobile-progress-toggle" style="margin:8px 0; font-size:15px; padding:10px 0; width:100%; display:block;" onclick="toggleMobileProgressBlocks(${comic.id})">Скрыть номера</button>
                    `);
                }
            }
            return blocks.join('');
        }
        function toggleMobileProgressBlocks(comicId) {
            const comic = comicsData.find(c => c.id === comicId);
            if (comic) {
                comic._mobileProgressExpanded = !comic._mobileProgressExpanded;
                renderCollection();
                renderReadingListContent();
            }
        }
        // --- SIDEBAR LOGIC ---
        function setSidebarOpen(isOpen) {
            const sidebar = document.getElementById('sidebar');
            if (!sidebar) return;
            sidebar.classList.toggle('open', isOpen);
            document.body.classList.toggle('sidebar-open', isOpen);
            refreshIcons();
        }

        window.setSidebarOpen = setSidebarOpen;

        function syncMobileHeaderOffset() {
            const header = document.querySelector('.header');
            if (!header || !window.matchMedia('(max-width: 768px)').matches) {
                document.documentElement.style.removeProperty('--mobile-header-offset');
                return;
            }
            document.documentElement.style.setProperty('--mobile-header-offset', header.offsetHeight + 'px');
        }

        window.addEventListener('resize', syncMobileHeaderOffset);
        window.addEventListener('load', syncMobileHeaderOffset);
        document.addEventListener('DOMContentLoaded', syncMobileHeaderOffset);

        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            setSidebarOpen(!sidebar.classList.contains('open'));
        }

        document.addEventListener('mousedown', function(e) {
            const sidebar = document.getElementById('sidebar');
            const settingsBtn = document.querySelector('.settings-btn');
            const backdrop = document.getElementById('sidebarBackdrop');
            if (!sidebar || !sidebar.classList.contains('open')) return;
            if (sidebar.contains(e.target)) return;
            if (settingsBtn && settingsBtn.contains(e.target)) return;
            setSidebarOpen(false);
        });

        // --- AUTH BUTTONS VISIBILITY ---
        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('loginBtn').style.display = 'none';
                document.getElementById('logoutBtn').style.display = 'inline-block';
                document.getElementById('userName').textContent = user.displayName || user.email;
                loadUserDataFromFirestore();
            } else {
                document.getElementById('loginBtn').style.display = 'inline-block';
                document.getElementById('logoutBtn').style.display = 'none';
                document.getElementById('userName').textContent = '';
                // ... existing code ...
            }
            requestAnimationFrame(syncMobileHeaderOffset);
        });
        // --- RESET ALL READ STATUS ---
        function resetAllReadStatus() {
            if (confirm('Сбросить статус прочитанного у всех комиксов?')) {
                comicsData.forEach(comic => {
                    comic.isRead = false;
                    comic.readIssues = 0;
                });
                saveData();
                renderCollection();
                renderReadingLists();
                alert('Статус прочитанного сброшен для всех комиксов!');
            }
        }
        // --- DELETE ALL DATA ---
        function deleteAllData() {
            if (confirm('ВНИМАНИЕ!\n\nЭто действие полностью удалит ВСЕ данные приложения. Восстановить данные будет невозможно!\n\nРекомендуется сначала сделать экспорт данных.\n\nВы уверены, что хотите продолжить?')) {
                if (confirm('Последнее предупреждение! ВСЕ ДАННЫЕ БУДУТ УДАЛЕНЫ НАВСЕГДА! Продолжить очистку?')) {
                    const user = auth.currentUser;
                    if (user) {
                        db.collection('comics').doc(user.uid).delete().then(() => {
                            clearLocalData();
                            alert('Все данные успешно удалены из облака и локально!');
                            setSidebarOpen(false);
                        }).catch((error) => {
                            clearLocalData();
                            alert('Ошибка при удалении из облака, но локальные данные удалены.\n' + error.message);
                            setSidebarOpen(false);
                        });
                    } else {
                        clearLocalData();
                        alert('Все данные успешно удалены!');
                        setSidebarOpen(false);
                    }
                }
            }
        }

        function clearLocalData() {
            comicsData = [];
            readingLists = [];
            listOrders = {};
            listViewModes = {};
            appSettings = {};
            currentlyReading = {};
            expandedLists = new Set();
            localStorage.removeItem('marvel-comics-data');
            localStorage.removeItem('marvel-reading-lists');
            localStorage.removeItem('marvel-list-orders');
            localStorage.removeItem('marvel-list-view-modes');
            localStorage.removeItem('marvel-app-settings');
            localStorage.removeItem('marvel-currently-reading');
            localStorage.removeItem('marvel-list-sort-modes');
            renderCollection();
            renderReadingLists();
        }
        // --- EXPORT READING LIST TO JSON ---
        function exportReadingListToJson(listName) {
            const listComics = getSortedComicsForList(listName);
            const exportData = {
                comicsData: listComics,
                listName: listName,
                order: listOrders[listName] ? [...listOrders[listName]] : listComics.map(c => c.id)
            };
            const dataStr = JSON.stringify(exportData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `${listName.replace(/[^a-zA-Zа-яА-Я0-9]/g, '_')}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

    </script>
</body>
